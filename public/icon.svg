<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080b18"/>
      <stop offset="50%" stop-color="#0d1329"/>
      <stop offset="100%" stop-color="#05070f"/>
    </linearGradient>
    <linearGradient id="uGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#2f6bff"/>
      <stop offset="100%" stop-color="#ff7a18"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#2f6bff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>
  
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" stroke="rgba(0, 212, 255, 0.4)" stroke-width="4" filter="url(#shadow)"/>
  <rect x="36" y="36" width="440" height="440" rx="108" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="2"/>

  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(47, 107, 255, 0.2)" stroke-width="40" filter="url(#glow)"/>

  <!-- U Monogram -->
  <path d="M160 140 V290 C160 360 210 395 256 395 C302 395 352 360 352 290 V140" 
        fill="none" stroke="url(#uGrad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- 3D Cursor Arrow -->
  <g transform="translate(180, 110) rotate(-12)">
    <path d="M0 0 L0 190 L52 145 L92 230 L132 210 L94 125 L160 125 Z" 
          fill="url(#arrowGrad)" stroke="#060814" stroke-width="12" stroke-linejoin="round" filter="url(#shadow)"/>
    <path d="M14 26 L14 150 L48 120 L80 190 L98 180 L68 112 L120 112 Z" 
          fill="rgba(255, 255, 255, 0.85)" opacity="0.4"/>
  </g>

  <circle cx="368" cy="150" r="8" fill="#ff7a18" filter="url(#glow)"/>
  <circle cx="140" cy="340" r="6" fill="#00d4ff" filter="url(#glow)"/>
</svg>